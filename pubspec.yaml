name: attendo
description: A calm, offline-first quarterly attendance tracker.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.1
  path: ^1.9.0
  shared_preferences: ^2.5.6
  network_info_plus: ^8.2.2
  geolocator: ^14.0.1
  flutter_local_notifications: ^22.3.2
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
